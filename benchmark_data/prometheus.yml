# Vaal AI Empire - Prometheus Configuration for Benchmark Metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'vaal-benchmark'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          environment: 'benchmark'

  - job_name: 'vaal-benchmark'
    static_configs:
      - targets: ['benchmark:8000']
        labels:
          service: 'benchmark-executor'
          environment: 'benchmark'
    metrics_path: '/metrics'
    scrape_interval: 10s
