# Vaal AI Empire - Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: 'Vaal Benchmark'
    orgId: 1
    folder: 'Benchmarks'
    folderUid: 'benchmarks'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
