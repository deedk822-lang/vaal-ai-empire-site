# Vaal AI Empire - Grafana Dashboard Provisioning
# Auto-provisions benchmark performance dashboards

apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: 'Benchmarks'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
