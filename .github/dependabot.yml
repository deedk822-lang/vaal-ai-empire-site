# ─────────────────────────────────────────────────────────
# FIX #20 (was): No dependabot.yml → dependencies never auto-updated
#          → CVE accumulation over time.
# ─────────────────────────────────────────────────────────
version: 2

updates:
  # ── GitHub Actions ──────────────────────────────────────────────────────────
  # Keeps all `uses:` action versions current — critical for supply-chain safety
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
    # Auto-approve patch/minor bumps; require review for major versions
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── Python pip ──────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(pip)"
    open-pull-requests-limit: 10
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── npm (server) ────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(npm)"
    open-pull-requests-limit: 10
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── Docker ──────────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
