name: "CodeQL Config for vaal-ai-empire-site"

# Paths to include in analysis
paths:
  - server
  - agents

# Paths to exclude from analysis
paths-ignore:
  - node_modules
  - '**/*.test.js'
  - '**/*.spec.js'
  - '**/tests/**'
  - '**/__pycache__/**'
  - ml/african_languages
  - '**/*.min.js'
  - '**/dist/**'
  - '**/build/**'
  - .venv
  - venv

# Query filters - exclude documented false positives
query-filters:
  # PayFast integration requires MD5 for signature generation (third-party requirement)
  # This is NOT used for password hashing or security-critical operations
  # Reference: https://developers.payfast.co.za/docs/secure-your-integration/
  - exclude:
      id: js/weak-cryptographic-algorithm
      reason: "PayFast API signature generation requires MD5 per their specification"

# Query suites to run
queries:
  - uses: security-and-quality
  - uses: security-extended
