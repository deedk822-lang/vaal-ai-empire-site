name: Custom CodeQL Configuration

# Disable default queries
disable-default-queries: false

# Paths to include in analysis
paths:
  - agents
  - server

# Paths to exclude from analysis
paths-ignore:
  - node_modules
  - '**/test*.py'
  - '**/tests/**'
  - '**/__pycache__/**'
  - '**/*.min.js'
  - '**/dist/**'
  - '**/build/**'
  - .venv
  - venv

# Query suites to run
queries:
  - uses: security-and-quality
  # Exclude false positive: PayFast MD5 signature is required by PayFast API
  # for ITN signature verification. This is NOT password storage - it's
  # HMAC-style request signing mandated by the payment provider.
  # Reference: https://developers.payfast.co.za/docs#signature-generation
  - exclude:
      id: js/insufficient-password-hash
