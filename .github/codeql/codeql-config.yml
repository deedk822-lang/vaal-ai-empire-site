name: "CodeQL Config for vaal-ai-empire-site"

# Paths to include in analysis
paths:
  - server
  - agents

# Paths to exclude from analysis
paths-ignore:
  - node_modules
  - '**/*.test.js'
  - '**/*.spec.js'
  - '**/tests/**'
  - '**/__pycache__/**'
  - ml/african_languages
  - '**/*.min.js'
  - '**/dist/**'
  - '**/build/**'
  - .venv
  - venv

# Query suites to run - use extended security suite
queries:
  - uses: security-extended
  - uses: security-and-quality

# APEX: PayFast MD5 suppression note
# The js/insufficient-password-hash alert for MD5 usage in paymentController.js
# is a FALSE POSITIVE - MD5 is mandated by PayFast API for ITN signature generation.
# This is NOT password hashing, it's request signing.
# Suppression is applied inline in the code:
#   // codeql[js/insufficient-password-hash] PAYFAST-API-COMPLIANCE: ...
# Reference: https://developers.payfast.co.za/docs/secure-your-integration/
