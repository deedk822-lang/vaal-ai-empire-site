name: Benchmark Performance

on:
  push:
    branches: [main, master, develop, merge/develop-to-main]
  pull_request:
    branches: [main, master, merge/develop-to-main]
  workflow_dispatch:
    inputs:
      category:
        description: 'Benchmark category to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - security
          - efficiency
          - edge_cases
          - code_generation
          - refactoring
          - debugging
      provider:
        description: 'AI provider to use'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - kimi
          - dashscope
          - glm

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  benchmark:
    name: Run Benchmark Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'
        continue-on-error: true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install pytest pytest-asyncio pytest-cov requests

      - name: Install Node.js dependencies
        working-directory: ./server
        run: npm ci || npm install
        continue-on-error: true

      - name: Create benchmark results directory
        run: mkdir -p benchmark_results

      - name: Install Ollama
        run: |
          echo "Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh
          
          # Start Ollama service in background
          ollama serve &
          
          # Wait for Ollama to be ready
          echo "Waiting for Ollama to start..."
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama is ready"
              break
            fi
            sleep 1
          done
          
          # Verify Ollama is running
          ollama --version
          ollama list

      - name: Pull Ollama models
        run: |
          echo "Pulling Ollama models..."
          
          # Pull lightweight models for CI
          # qwen2.5-coder:1.5b is small and fast for code generation
          ollama pull qwen2.5-coder:1.5b || echo "⚠️ Failed to pull qwen2.5-coder:1.5b"
          
          # phi4 is also lightweight and good for coding
          ollama pull phi4 || echo "⚠️ Failed to pull phi4"
          
          # List available models
          echo "Available Ollama models:"
          ollama list

      - name: Run benchmark suite
        id: benchmark_run
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          GLM5_API_KEY: ${{ secrets.GLM5_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          OLLAMA_HOST: http://localhost:11434
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Ensure benchmark results directory exists
          mkdir -p benchmark_results
          
          # Build command with appropriate flags
          CMD="python agents/benchmark_executor.py --run-all --report --output benchmark_results/report.json"
          
          # Add provider if specified
          if [ "${{ github.event.inputs.provider }}" != "" ]; then
            CMD="$CMD --provider ${{ github.event.inputs.provider }}"
          fi
          
          # Add category if specified
          if [ "${{ github.event.inputs.category }}" != "" ] && [ "${{ github.event.inputs.category }}" != "all" ]; then
            CMD="$CMD --category ${{ github.event.inputs.category }}"
          fi
          
          # Check if any AI backend is available
          if [ -z "$KIMI_API_KEY" ] && [ -z "$GLM5_API_KEY" ] && [ -z "$DASHSCOPE_API_KEY" ] && [ -z "$OLLAMA_HOST" ]; then
            echo "⚠️ No AI backends configured - running in resilient mode"
            CMD="$CMD --no-quality-eval"
          else
            echo "✅ AI backend(s) detected - running with full evaluation"
            
            # Show which backends are available
            if [ -n "$KIMI_API_KEY" ]; then echo "  - Kimi API ✅"; fi
            if [ -n "$GLM5_API_KEY" ]; then echo "  - GLM API ✅"; fi
            if [ -n "$DASHSCOPE_API_KEY" ]; then echo "  - DashScope API ✅"; fi
            if [ -n "$OLLAMA_HOST" ]; then echo "  - Ollama (local) ✅"; fi
          fi
          
          echo "Running: $CMD"
          eval "$CMD"
          
          # Ensure report exists even if benchmark had issues
          if [ ! -f benchmark_results/report.json ]; then
            echo '{"timestamp": "'$(date -Iseconds)'", "summary": {"total_tests": 0, "passed_tests": 0, "failed_tests": 0, "overall_score": 0}, "category_scores": {}, "backend_stats": {"resilient_fallbacks": 0, "usage": {}}, "results": []}' > benchmark_results/report.json
          fi

      - name: Generate benchmark summary
        if: always()
        run: |
          python3 << 'PYEOF'
          import json
          import os
          from pathlib import Path

          report_path = Path('benchmark_results/report.json')
          if report_path.exists():
              with open(report_path) as f:
                  data = json.load(f)

              summary = data.get('summary', {})
              backend_stats = data.get('backend_stats', {})
              
              print('## 📊 Benchmark Results')
              print('')
              print('| Metric | Value |')
              print('|--------|-------|')
              print(f"| Total Tests | {summary.get('total_tests', 0)} |")
              print(f"| Passed | {summary.get('passed_tests', 0)} ✅ |")
              print(f"| Failed | {summary.get('failed_tests', 0)} ❌ |")
              print(f"| Overall Score | {summary.get('overall_score', 0):.1f}% |")
              print(f"| Avg Execution Time | {summary.get('avg_execution_time_ms', 0):.2f}ms |")
              
              # Show backend usage
              usage = backend_stats.get('usage', {})
              if usage:
                  print('')
                  print('### Backend Usage')
                  for backend, count in usage.items():
                      print(f"- **{backend}**: {count} requests")
              
              resilient = backend_stats.get('resilient_fallbacks', 0)
              if resilient > 0:
                  print(f"")
                  print(f"⚠️ **Resilient fallbacks**: {resilient}")

              # Write to GITHUB_STEP_SUMMARY
              summary_file = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/stdout')
              with open(summary_file, 'a') as f:
                  f.write('## 📊 Benchmark Results\n\n')
                  f.write('| Metric | Value |\n')
                  f.write('|--------|-------|\n')
                  f.write(f"| Total Tests | {summary.get('total_tests', 0)} |\n")
                  f.write(f"| Passed | {summary.get('passed_tests', 0)} ✅ |\n")
                  f.write(f"| Failed | {summary.get('failed_tests', 0)} ❌ |\n")
                  f.write(f"| Overall Score | {summary.get('overall_score', 0):.1f}% |\n")
                  f.write(f"| Avg Execution Time | {summary.get('avg_execution_time_ms', 0):.2f}ms |\n')
                  
                  if usage:
                      f.write('\n### Backend Usage\n')
                      for backend, count in usage.items():
                          f.write(f"- **{backend}**: {count} requests\n")
                  
                  if resilient > 0:
                      f.write(f"\n⚠️ **Resilient fallbacks**: {resilient}\n")
          else:
              print('No benchmark report found')
          PYEOF

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results/
          retention-days: 30

      - name: Generate coverage placeholder
        if: always()
        run: |
          # Create coverage directory and placeholder if not exists
          mkdir -p htmlcov
          if [ ! -f coverage.xml ]; then
            echo '<?xml version="1.0" ?><coverage version="5.5" timestamp="'$(date -Iseconds)'"><packages/></coverage>' > coverage.xml
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7
          if-no-files-found: warn
        continue-on-error: true

  # Optional: Run benchmarks in Docker
  benchmark-docker:
    name: Run Benchmark in Docker
    runs-on: ubuntu-latest
    needs: benchmark
    # Run on push to main or on PRs targeting main/merge branches
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build benchmark image
        run: |
          docker compose -f docker-compose.benchmark.yml build
        continue-on-error: true

      - name: Run benchmark container
        run: |
          docker compose -f docker-compose.benchmark.yml up --abort-on-container-exit
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          GLM5_API_KEY: ${{ secrets.GLM5_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        continue-on-error: true

      - name: Copy results from container
        if: always()
        run: |
          # Try both possible container names
          docker cp vaal-benchmark-runner:/app/benchmark_results ./benchmark_results_docker 2>/dev/null || \
          docker cp benchmark-runner:/app/benchmark_results ./benchmark_results_docker 2>/dev/null || \
          echo "Could not copy results - container may not have started"
        continue-on-error: true

      - name: Create placeholder results if missing
        if: always()
        run: |
          mkdir -p benchmark_results_docker
          if [ ! -f benchmark_results_docker/report.json ]; then
            echo '{"timestamp": "'$(date -Iseconds)'", "summary": {"total_tests": 0, "passed_tests": 0, "failed_tests": 0, "overall_score": 0}, "category_scores": {}, "backend_stats": {"resilient_fallbacks": 0, "usage": {}}, "results": []}' > benchmark_results_docker/report.json
          fi

      - name: Upload Docker benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-docker
          path: benchmark_results_docker/
          retention-days: 30
          if-no-files-found: warn
        continue-on-error: true

  # Performance regression check
  regression-check:
    name: Check for Performance Regressions
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: current_results
        continue-on-error: true

      - name: Check if artifact exists
        id: check_artifact
        run: |
          if [ ! -f "current_results/report.json" ]; then
            echo "::notice::No benchmark results artifact found"
            echo "overall_score=0" >> $GITHUB_OUTPUT
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Compare with baseline
        if: steps.check_artifact.outputs.exists == 'true'
        id: compare
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import json
          import os
          from pathlib import Path

          # Load current results
          current_path = Path('current_results/report.json')
          if not current_path.exists():
              print('::notice::No benchmark results found for comparison')
              # Write empty output
              with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
                  f.write('overall_score=0\n')
              exit(0)

          try:
              with open(current_path) as f:
                  current = json.load(f)
          except Exception as e:
              print(f'::warning::Could not parse benchmark results: {e}')
              exit(0)

          # Check for regressions
          summary = current.get('summary', {})
          overall_score = summary.get('overall_score', 0)
          backend_stats = current.get('backend_stats', {})
          
          # Check if running in resilient mode (no backends available)
          resilient_fallbacks = backend_stats.get('resilient_fallbacks', 0)
          backend_usage = backend_stats.get('usage', {})
          has_no_backend = resilient_fallbacks > 0 or (not backend_usage)

          # Set output for GitHub Actions
          summary_file = os.environ.get('GITHUB_OUTPUT', '/dev/null')
          with open(summary_file, 'a') as f:
              f.write(f'overall_score={overall_score}\n')

          print(f'::notice::Current benchmark score: {overall_score:.1f}%')
          
          # Skip failure check if running without backends (CI mode)
          if has_no_backend:
              print('::notice::Benchmark ran in resilient mode (no AI backends available). Skipping regression check.')
              exit(0)

          # Only fail if backends were available but score is critically low
          if overall_score < 50:
              print('::error::Benchmark score critically low (< 50%)')
              exit(1)
          elif overall_score < 70:
              print('::warning::Benchmark score below 70% threshold')
          else:
              print('::notice::Benchmark score acceptable (>= 70%)')
          PYEOF

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            async function main() {
              const fs = require('fs');
              let report = {};
              try {
                report = JSON.parse(fs.readFileSync('current_results/report.json', 'utf8'));
              } catch (e) {
                console.log('Could not read report:', e.message);
                return;
              }

              const summary = report.summary || {};
              const backend_stats = report.backend_stats || {};
              const usage = backend_stats.usage || {};
              const resilient = backend_stats.resilient_fallbacks || 0;
              
              let body = `## Benchmark Results

              | Metric | Value |
              |--------|-------|
              | Total Tests | ${summary.total_tests || 0} |
              | Passed | ${summary.passed_tests || 0} |
              | Failed | ${summary.failed_tests || 0} |
              | Overall Score | ${(summary.overall_score || 0).toFixed(1)}% |
              | Avg Execution Time | ${(summary.avg_execution_time_ms || 0).toFixed(2)}ms |
              `;
              
              if (Object.keys(usage).length > 0) {
                body += '\n### Backend Usage\n';
                for (const [backend, count] of Object.entries(usage)) {
                  body += `- **${backend}**: ${count} requests\n`;
                }
              }
              
              if (resilient > 0) {
                body += `\n⚠️ **Resilient fallbacks**: ${resilient}\n`;
              }
              
              body += summary.overall_score >= 70 ? '\n✅ Benchmarks passing!' : '\n⚠️ Some benchmarks need attention';

              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
                console.log('Comment posted successfully');
              } catch (error) {
                console.error('Failed to post comment:', error.message);
              }
            }
            
            await main();
