name: Benchmark Performance

on:
  push:
    branches: [main, master, merge/develop-to-main]
  pull_request:
    branches: [main, master, merge/develop-to-main]
  workflow_dispatch:
    inputs:
      category:
        description: 'Benchmark category to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - security
          - efficiency
          - edge_cases
          - code_generation
          - refactoring
          - debugging

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  benchmark:
    name: Run Benchmark Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Install Node.js dependencies
        working-directory: ./server
        run: npm ci

      - name: Create benchmark results directory
        run: mkdir -p benchmark_results

      - name: Run benchmark suite
        id: benchmark_run
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          GLM5_API_KEY: ${{ secrets.GLM5_API_KEY }}
        run: |
          # Check if API keys are available
          HAS_DASHSCOPE="${{ secrets.DASHSCOPE_API_KEY != '' }}"
          HAS_GLM5="${{ secrets.GLM5_API_KEY != '' }}"
          
          # Export for shell evaluation
          export HAS_DASHSCOPE HAS_GLM5
          
          # Build command with appropriate flags
          CMD="python agents/benchmark_executor.py --run-all --report --output benchmark_results/report.json"
          
          # Add category if specified
          if [ "${{ github.event.inputs.category }}" != "" ] && [ "${{ github.event.inputs.category }}" != "all" ]; then
            CMD="$CMD --category ${{ github.event.inputs.category }}"
          fi
          
          # Disable quality eval if no GLM5 key
          if [ "$HAS_GLM5" != "true" ]; then
            CMD="$CMD --no-quality-eval"
            echo "⚠️ GLM5_API_KEY not set - running without quality evaluation"
          fi
          
          echo "Running: $CMD"
          eval "$CMD"
          BENCHMARK_EXIT=$?
          
          # Output the exit code for downstream steps
          echo "benchmark_exit=$BENCHMARK_EXIT" >> $GITHUB_OUTPUT
          
          # Report failure but don't fail the step if benchmarks partially fail
          if [ $BENCHMARK_EXIT -ne 0 ]; then
            echo "⚠️ Benchmark completed with some failures (exit code $BENCHMARK_EXIT)"
          fi
          
          exit 0

      - name: Generate benchmark summary
        if: always()
        run: |
          python3 << 'PYEOF'
          import json
          import os
          from pathlib import Path

          report_path = Path('benchmark_results/report.json')
          if report_path.exists():
              with open(report_path) as f:
                  data = json.load(f)

              summary = data.get('summary', {})
              print('## 📊 Benchmark Results')
              print('')
              print('| Metric | Value |')
              print('|--------|-------|')
              print(f"| Total Tests | {summary.get('total_tests', 0)} |")
              print(f"| Passed | {summary.get('passed_tests', 0)} ✅ |")
              print(f"| Failed | {summary.get('failed_tests', 0)} ❌ |")
              print(f"| Overall Score | {summary.get('overall_score', 0):.1f}% |")
              print(f"| Avg Execution Time | {summary.get('avg_execution_time_ms', 0):.2f}ms |")

              # Write to GITHUB_STEP_SUMMARY (append mode to preserve prior summaries)
              summary_file = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/stdout')
              with open(summary_file, 'a') as f:
                  f.write('## 📊 Benchmark Results\n\n')
                  f.write('| Metric | Value |\n')
                  f.write('|--------|-------|\n')
                  f.write(f"| Total Tests | {summary.get('total_tests', 0)} |\n")
                  f.write(f"| Passed | {summary.get('passed_tests', 0)} ✅ |\n")
                  f.write(f"| Failed | {summary.get('failed_tests', 0)} ❌ |\n")
                  f.write(f"| Overall Score | {summary.get('overall_score', 0):.1f}% |\n")
                  f.write(f"| Avg Execution Time | {summary.get('avg_execution_time_ms', 0):.2f}ms |\n")

              # Category scores
              categories = data.get('category_scores', {})
              if categories:
                  print('')
                  print('### Category Scores')
                  print('')
                  for cat, score in categories.items():
                      print(f"- **{cat}**: {score:.1f}/10")
          PYEOF

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results/
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7

  # Optional: Run benchmarks in Docker
  benchmark-docker:
    name: Run Benchmark in Docker
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build benchmark image
        run: |
          docker compose -f docker-compose.benchmark.yml build

      - name: Run benchmark container
        run: |
          docker compose -f docker-compose.benchmark.yml up --abort-on-container-exit

      - name: Copy results from container
        run: |
          docker cp benchmark-runner:/app/benchmark_results ./benchmark_results_docker

      - name: Upload Docker benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-docker
          path: benchmark_results_docker/
          retention-days: 30

  # Performance regression check
  regression-check:
    name: Check for Performance Regressions
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: current_results

      - name: Download baseline benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: baseline_results
        continue-on-error: true

      - name: Compare with baseline
        id: compare
        run: |
          python -c "
          import json
          import os
          from pathlib import Path

          # Load current results
          current_path = Path('current_results/report.json')
          if not current_path.exists():
              print('No current results found')
              exit(0)

          with open(current_path) as f:
              current = json.load(f)

          # Load baseline results if available
          baseline_path = Path('baseline_results/report.json')
          baseline_score = None
          if baseline_path.exists():
              try:
                  with open(baseline_path) as f:
                      baseline = json.load(f)
                  baseline_score = baseline.get('summary', {}).get('overall_score', 0)
                  print(f'Baseline score: {baseline_score:.1f}%')
              except Exception as e:
                  print(f'Could not load baseline: {e}')

          # Check for regressions
          summary = current.get('summary', {})
          overall_score = summary.get('overall_score', 0)

          # Set output for GitHub Actions
          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
              f.write(f'overall_score={overall_score}\n')

          print(f'Current score: {overall_score:.1f}%')

          # Compare with baseline if available
          if baseline_score is not None:
              diff = overall_score - baseline_score
              if diff < -10:
                  print(f'::error::Performance regression detected: {diff:.1f}% drop from baseline')
              elif diff < -5:
                  print(f'::warning::Performance decrease: {diff:.1f}% from baseline')
              elif diff > 5:
                  print(f'::notice::Performance improvement: +{diff:.1f}% from baseline')

          # Fail if score drops below threshold
          # Check < 50 FIRST (more critical), then < 70
          if overall_score < 50:
              print('::error::Benchmark score critically low (< 50%)')
              exit(1)
          elif overall_score < 70:
              print('::warning::Benchmark score below 70% threshold')
          else:
              print('::notice::Benchmark score acceptable (>= 70%)')
          "

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = {};
            try {
              report = JSON.parse(fs.readFileSync('current_results/report.json', 'utf8'));
            } catch (e) {
              console.log('Could not read report');
            }

            const summary = report.summary || {};
            const body = `## Benchmark Results

            | Metric | Value |
            |--------|-------|
            | Total Tests | ${summary.total_tests || 0} |
            | Passed | ${summary.passed_tests || 0} |
            | Failed | ${summary.failed_tests || 0} |
            | Overall Score | ${(summary.overall_score || 0).toFixed(1)}% |
            | Avg Execution Time | ${(summary.avg_execution_time_ms || 0).toFixed(2)}ms |

            ${summary.overall_score >= 80 ? 'Benchmarks passing!' : 'Some benchmarks need attention'}`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
