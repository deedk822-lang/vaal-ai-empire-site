name: Benchmark Performance

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents:      read
  pull-requests: write

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements.txt --quiet

      - name: Run benchmarks
        id: run-benchmarks
        run: |
          echo "Running performance benchmarks..."
          python -m pytest benchmarks/ \
            --benchmark-json=benchmark-report.json \
            --benchmark-min-rounds=5 \
            -q || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name:            benchmark-report
          path:            benchmark-report.json
          retention-days:  30
          if-no-files-found: warn

      - name: Post PR comment
        # Only run on pull_request events where we have a PR number
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const fs   = require('fs');
            const core = require('@actions/core');

            // Renamed from `path` to `reportPath` to avoid shadowing Node's path module
            const reportPath = 'benchmark-report.json';

            if (!fs.existsSync(reportPath)) {
              core.notice('No benchmark report found — skipping PR comment');
              return;
            }

            let report;
            try {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            } catch (parseErr) {
              core.warning(`Failed to parse benchmark report: ${parseErr.message}`);
              return;
            }

            const s = report.summary || report;
            const body = [
              '## 📊 Benchmark Results',
              '',
              '| Metric | Value |',
              '|--------|-------|',
              `| Mean latency   | ${s.mean         ?? 'N/A'} |`,
              `| Median latency | ${s.median       ?? 'N/A'} |`,
              `| P95 latency    | ${s.p95          ?? 'N/A'} |`,
              `| Throughput     | ${s.throughput   ?? 'N/A'} ops/s |`,
              `| Benchmark runs | ${s.total_rounds ?? 'N/A'} |`,
              '',
              `_Commit: \`${context.sha.substring(0, 8)}\` · Branch: \`${context.ref}\`_`,
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                body,
              });
              core.notice('PR comment posted successfully');
            } catch (err) {
              // Use core.warning so the annotation appears in the workflow UI
              core.warning(`Could not post PR comment: ${err.message}`);
            }
