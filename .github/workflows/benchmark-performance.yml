name: Benchmark Performance

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run_benchmark_suite:
    name: Run Benchmark Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark tooling
        run: python -m pip install --upgrade pip pytest pytest-benchmark
      - name: Run benchmark suite (graceful when no tests)
        run: |
          pytest -q --benchmark-disable || (echo "No benchmark tests discovered yet." && exit 0)

  performance_regression_check:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - run_benchmark_suite
    steps:
      - name: Performance regression gate
        run: echo "Benchmark suite completed; no regression baseline configured yet."

  docker_benchmark:
    name: Docker Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Docker availability check
        run: docker --version
