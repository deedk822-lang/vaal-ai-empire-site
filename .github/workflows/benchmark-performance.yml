name: Benchmark Performance

on:
  push:
    branches: [merge/develop-to-main]
  pull_request:
    branches: [merge/develop-to-main]
  workflow_dispatch:
    inputs:
      category:
        description: 'Benchmark category to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - security
          - efficiency
          - edge_cases
          - code_generation
          - refactoring
          - debugging

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  benchmark:
    name: Run Benchmark Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Install Node.js dependencies
        working-directory: ./server
        run: npm ci

      - name: Create benchmark results directory
        run: mkdir -p benchmark_results

      - name: Run benchmark suite
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          GLM5_API_KEY: ${{ secrets.GLM5_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.category }}" != "" ] && [ "${{ github.event.inputs.category }}" != "all" ]; then
            python agents/benchmark_executor.py \
              --run-all \
              --report \
              --output benchmark_results/report.json \
              --category ${{ github.event.inputs.category }}
          else
            python agents/benchmark_executor.py \
              --run-all \
              --report \
              --output benchmark_results/report.json
          fi

      - name: Generate benchmark summary
        if: always()
        run: |
          python3 << 'PYEOF'
          import json
          import os
          from pathlib import Path

          report_path = Path('benchmark_results/report.json')
          if report_path.exists():
              with open(report_path) as f:
                  data = json.load(f)

              summary = data.get('summary', {})
              print('## 📊 Benchmark Results')
              print('')
              print('| Metric | Value |')
              print('|--------|-------|')
              print(f"| Total Tests | {summary.get('total_tests', 0)} |")
              print(f"| Passed | {summary.get('passed_tests', 0)} ✅ |")
              print(f"| Failed | {summary.get('failed_tests', 0)} ❌ |")
              print(f"| Overall Score | {summary.get('overall_score', 0):.1f}% |")
              print(f"| Avg Execution Time | {summary.get('avg_execution_time_ms', 0):.2f}ms |")

              # Write to GITHUB_STEP_SUMMARY
              summary_file = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/stdout')
              with open(summary_file, 'w') as f:
                  f.write('## 📊 Benchmark Results\n\n')
                  f.write('| Metric | Value |\n')
                  f.write('|--------|-------|\n')
                  f.write(f"| Total Tests | {summary.get('total_tests', 0)} |\n")
                  f.write(f"| Passed | {summary.get('passed_tests', 0)} ✅ |\n")
                  f.write(f"| Failed | {summary.get('failed_tests', 0)} ❌ |\n")
                  f.write(f"| Overall Score | {summary.get('overall_score', 0):.1f}% |\n")
                  f.write(f"| Avg Execution Time | {summary.get('avg_execution_time_ms', 0):.2f}ms |\n")

              # Category scores
              categories = data.get('category_scores', {})
              if categories:
                  print('')
                  print('### Category Scores')
                  print('')
                  for cat, score in categories.items():
                      print(f"- **{cat}**: {score:.1f}/10")
          PYEOF

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results/
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7
