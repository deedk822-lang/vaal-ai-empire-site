name: Hybrid Benchmark

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct_api_backend_tests:
    name: Direct API Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate required API secrets
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          GLM5_API_KEY: ${{ secrets.GLM5_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          test -n "$DASHSCOPE_API_KEY"
          test -n "$GLM5_API_KEY"
          test -n "$KIMI_API_KEY"
          test -n "$PERPLEXITY_API_KEY"
          echo "Direct API secret validation passed."

  ollama_backend_tests:
    name: Ollama Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Ollama secret
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          test -n "$OLLAMA_API_KEY"
          echo "Ollama secret validation passed."

  generate_benchmark_summary:
    name: Generate Benchmark Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - direct_api_backend_tests
      - ollama_backend_tests
    steps:
      - name: Generate summary artifact
        run: |
          mkdir -p artifacts
          printf "Hybrid benchmark summary generated at %s\n" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > artifacts/summary.txt
          cat artifacts/summary.txt
