name: Hybrid Benchmark

"on":
  pull_request:
  push:

permissions:
  contents: read

jobs:
  direct_api_backend_tests:
    name: Direct API Backend Tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "Direct API backend smoke test passed."

  ollama_backend_tests:
    name: Ollama Backend Tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "Ollama backend smoke test passed."

  generate_benchmark_summary:
    name: Generate Benchmark Summary
    needs: [direct_api_backend_tests, ollama_backend_tests]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Benchmark summary generated."
