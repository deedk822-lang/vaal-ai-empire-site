name: Security Scan

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: "0 8 * * 1"

permissions:
  actions:          read
  contents:         read
  security-events:  write

jobs:
  # ──────────────────────────────────────────
  # CodeQL Analysis
  # ──────────────────────────────────────────
  codeql:
    name: CodeQL — ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # Upgrade: v3 → v4 (uses Node.js 24, required from June 2025)
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4      # ← was @v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # No continue-on-error here — init failure should block the job

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4 # ← was @v3
        # No continue-on-error — build failure should surface immediately

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4   # ← was @v3, was continue-on-error:true
        # Removed continue-on-error: true — analysis failures must fail the job.
        # A silent analysis failure could let vulnerabilities pass undetected.
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4  # ← was @v3, was continue-on-error:true
        # Removed continue-on-error: true — upload failures must fail the job.
        if: always()  # Still upload even when analysis found issues
        with:
          sarif_file: sarif-results/${{ matrix.language }}.sarif
          category:   /language:${{ matrix.language }}

  # ──────────────────────────────────────────
  # Dependency audit
  # ──────────────────────────────────────────
  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run audit (high + critical)
        run: npm audit --audit-level=high

  pip-audit:
    name: pip Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit --break-system-packages 2>/dev/null || pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --strict

  # ──────────────────────────────────────────
  # Secret scanning (Gitleaks)
  # ──────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
