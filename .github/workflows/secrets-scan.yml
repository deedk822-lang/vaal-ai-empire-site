name: ci/secrets-scan

on:
  pull_request:
  push:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if git grep -nE '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)' -- .; then
            echo "Potential secret detected" >&2
            exit 1
          fi
          echo "No obvious plaintext secrets detected."
