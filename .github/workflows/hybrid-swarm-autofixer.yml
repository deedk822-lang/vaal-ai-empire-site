name: Hybrid Swarm Autofixer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to fix
        required: false
        type: string

permissions:
  contents:      write
  pull-requests: write

concurrency:
  group: hybrid-swarm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  # Core autofixer job
  # ──────────────────────────────────────────
  autofix:
    name: Swarm Autofix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # Pinned SHA — consistent with all other workflows
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.VAAL_MONEY_BOT }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Run hybrid swarm autofixer
        env:
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY:  ${{ secrets.PERPLEXITY_API_KEY }}
          CODERABBIT_API_KEY:  ${{ secrets.CODERABBIT_API_KEY }}
          PR_NUMBER:           ${{ github.event.pull_request.number || inputs.pr_number }}
        run: python agents/sentient_swarm/hybrid_autofixer.py

      - name: Upload swarm output
        id: upload-swarm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name:            swarm-output-${{ github.run_id }}
          path:            swarm-output/
          retention-days:  14
          if-no-files-found: warn

  # ──────────────────────────────────────────
  # Metrics export (no source checkout needed)
  # ──────────────────────────────────────────
  metrics-export:
    name: Export Swarm Metrics
    runs-on: ubuntu-latest
    needs: autofix
    if: always()

    steps:
      # Previous revision had `actions/checkout@v4` (mutable tag) here.
      # The subsequent steps only use downloaded artifacts and env checks,
      # so a source checkout is not required at all.
      # Removed to eliminate unnecessary runner overhead and mutable tag risk.

      - name: Download swarm output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: swarm-output-${{ github.run_id }}
          path: swarm-output/

      - name: Setup Python (for metric scripts only)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install metric export dependencies
        run: pip install prometheus-client requests --quiet

      - name: Export to Prometheus
        env:
          PROMETHEUS_URL:     ${{ secrets.PROMETHEUS_URL }}
          PROMETHEUS_USER:    ${{ secrets.PROMETHEUS_USER }}
          PROMETHEUS_API_KEY: ${{ secrets.PROMETHEUS_API_KEY }}
        run: |
          if [ -z "$PROMETHEUS_URL" ]; then
            echo "::warning::PROMETHEUS_URL not set — skipping Prometheus export."
            exit 0
          fi
          python scripts/push_swarm_metrics.py --input swarm-output/

      - name: Export to Grafana
        env:
          GRAFANA_API_KEY:         ${{ secrets.GRAFANA_API_KEY }}
          GRAFANA_DATASOURCE_NAME: ${{ secrets.GRAFANA_DATASOURCE_NAME }}
          GRAFANA_GITHUB:          ${{ secrets.GRAFANA_GITHUB }}
        run: |
          if [ -z "$GRAFANA_API_KEY" ]; then
            echo "::warning::GRAFANA_API_KEY not set — skipping Grafana export."
            exit 0
          fi
          python scripts/push_grafana_annotations.py --input swarm-output/
