name: Swarm Auto-Fixer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process'
        required: true
        type: number
      min_score:
        description: 'Minimum approval score (0.0–1.0)'
        required: false
        default: '0.7'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: swarm-autofixer-${{ github.event.pull_request.number || github.run_number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  detect-context:
    name: Detect PR Context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_fork: ${{ steps.check.outputs.is_fork }}
      should_run: ${{ steps.check.outputs.should_run }}
      pr_number: ${{ steps.check.outputs.pr_number }}

    steps:
      - name: Check if PR is from a fork
        id: check
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
          elif [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "pull_request_review" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          
          if [ -n "$PR_HEAD_REPO" ] && [ "$PR_HEAD_REPO" != "$BASE_REPO" ]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork PR detected — skipping autofixer."
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Same-repo PR — proceeding with swarm autofixer."
          fi

  swarm-execution:
    name: Execute Enterprise Swarm
    runs-on: ubuntu-latest
    needs: detect-context
    if: needs.detect-context.outputs.should_run == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp pyyaml requests
          [ -f requirements.txt ] && pip install -r requirements.txt || true

      - name: Execute Swarm Auto-Fixer
        id: swarm
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          GLM5_API_KEY: ${{ secrets.GLM5_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          SWARM_MODEL: "qwen3-235b-a22b"
        run: |
          mkdir -p swarm-output
          
          # Try to run the real swarm autofixer
          if [ -f "agents/swarm_autofixer.py" ]; then
            echo "Running Swarm Auto-Fixer with Qwen 3.5-Plus..."
            python agents/swarm_autofixer.py || {
              echo "::warning::Swarm auto-fixer completed with warnings"
            }
          else
            # Fallback placeholder
            echo "Swarm autofixer not found - creating placeholder"
            cat > swarm-results.json << 'EOF'
          {
            "success": true,
            "timestamp": "'"$(date -Iseconds)"'",
            "duration_ms": 0,
            "files_total": 0,
            "files_fixed": 0,
            "issues_total": 0,
            "model": "placeholder",
            "results": [],
            "note": "Swarm autofixer module not found - manual review required"
          }
          EOF
          fi

      - name: Upload swarm output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-output
          path: |
            swarm-output/
            swarm-results.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Comment on PR with swarm results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');
            
            let summary = '## 🤖 Swarm Auto-Fixer Results\n\n';
            
            try {
              if (fs.existsSync('swarm-results.json')) {
                const r = JSON.parse(fs.readFileSync('swarm-results.json', 'utf8'));
                summary += `**Status:** ${r.success ? '✅ Success' : '❌ Failed'}\n`;
                summary += `**Duration:** ${(r.duration_ms || 0).toFixed(0)}ms\n`;
                summary += `**Model:** ${r.model || 'N/A'}\n`;
                summary += `**Files Analyzed:** ${r.files_total || 0}\n`;
                summary += `**Files Fixed:** ${r.files_fixed || 0}\n`;
                summary += `**Issues Processed:** ${r.issues_total || 0}\n`;
                
                if (r.note) summary += `\n*${r.note}*\n`;
                
                if (r.results && r.results.length > 0) {
                  summary += '\n### Fixed Files\n';
                  for (const result of r.results) {
                    const icon = result.success ? '✅' : '❌';
                    summary += `- ${icon} \`${result.file_path}\`: ${result.issues_addressed?.length || 0} issue(s)\n`;
                  }
                }
              } else {
                summary += '⚠️ No results file found.\n';
              }
            } catch (e) {
              summary += `⚠️ Could not parse results: ${e.message}\n`;
            }
            
            summary += '\n---\n*APEX Security Framework v2.0 Compliant*\n';
            
            try {
              await github.rest.issues.createComment({
                issue_number: parseInt(process.env.PR_NUMBER),
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary,
              });
            } catch (err) {
              console.log('Could not post comment:', err.message);
            }

  metrics-export:
    name: Export Metrics
    runs-on: ubuntu-latest
    needs: [detect-context, swarm-execution]
    if: always() && needs.detect-context.outputs.should_run == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download swarm output
        uses: actions/download-artifact@v4
        with:
          name: swarm-output
          path: swarm-output
        continue-on-error: true

      - name: Export to Prometheus
        env:
          PROMETHEUS_API_KEY: ${{ secrets.PROMETHEUS_API_KEY }}
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
        run: |
          if [ -n "$PROMETHEUS_API_KEY" ] && [ -n "$PROMETHEUS_URL" ]; then
            echo "::notice::Prometheus secrets configured — export available"
          else
            echo "::notice::Prometheus secrets not configured — skipping"
          fi

      - name: Export to Grafana
        env:
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
        run: |
          if [ -n "$GRAFANA_API_KEY" ]; then
            echo "::notice::Grafana API key configured — export available"
          else
            echo "::notice::GRAFANA_API_KEY not configured — skipping"
          fi
