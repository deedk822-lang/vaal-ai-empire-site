name: Hybrid Swarm Auto-Fixer

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened]
    # Note: Only 'opened' triggers the fixer to avoid redundant runs on sync/reopen
    # synchronize/reopened events are received but filtered by check-trigger job
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process'
        required: true
        type: number
      min_score:
        description: 'Minimum approval score (0.0-1.0)'
        required: false
        default: '0.7'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: swarm-fixer-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  check-trigger:
    name: Check Trigger Conditions
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - name: Check conditions
        id: check
        run: |
          SHOULD_RUN="false"
          PR_NUMBER=""
          
          # Manual dispatch
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SHOULD_RUN="true"
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
          fi
          
          # PR review from CodeRabbit
          if [ "${{ github.event_name }}" == "pull_request_review" ]; then
            if [ "${{ github.event.review.user.login }}" == "coderabbitai" ]; then
              SHOULD_RUN="true"
              PR_NUMBER="${{ github.event.pull_request.number }}"
            fi
          fi
          
          # New PR opened
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Only run on PR open, not every sync
            if [ "${{ github.event.action }}" == "opened" ]; then
              SHOULD_RUN="true"
              PR_NUMBER="${{ github.event.pull_request.number }}"
            fi
          fi
          
          echo "should_run=${SHOULD_RUN}" >> $GITHUB_OUTPUT
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          
          echo "Should run: ${SHOULD_RUN}"
          echo "PR Number: ${PR_NUMBER}"

  hybrid-swarm-fix:
    name: Run Hybrid Swarm Fixer
    runs-on: ubuntu-latest
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    timeout-minutes: 30

    steps:
      - name: Get PR details
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ needs.check-trigger.outputs.pr_number }}"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          
          # Get PR branch
          PR_BRANCH=$(gh pr view $PR_NUMBER --json headRefName --jq '.headRefName')
          echo "pr_branch=${PR_BRANCH}" >> $GITHUB_OUTPUT
          
          echo "Processing PR #$PR_NUMBER on branch: $PR_BRANCH"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.pr_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp pytest pytest-asyncio prometheus-client
          
          # Optional telemetry packages
          pip install opentelemetry-api opentelemetry-sdk 2>/dev/null || true

          # Install required packages explicitly
          pip install aiohttp==3.13.3 pyyaml
          # Also install from requirements if exists for other deps
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Verify aiohttp is installed
          python -c "import aiohttp; print(f'aiohttp {aiohttp.__version__} installed')"

      - name: Install OLLAMA (Primary AI Provider)
        run: |
          echo "🏠 Installing OLLAMA..."
          
          # Install Ollama
          curl -fsSL https://ollama.com/install.sh | sh
          
          # Start Ollama daemon in background
          ollama serve &
          # Wait until Ollama is accepting connections (max 30s)
          for i in $(seq 1 30); do
            ollama list >/dev/null 2>&1 && break
            sleep 1
          done
          
          # Pull primary model only (others can be pulled on-demand if needed)
          echo "📦 Pulling primary OLLAMA model..."
          ollama pull llama3.2:latest || echo "llama3.2 not available"
          
          # List what's available
          echo ""
          echo "✅ Available OLLAMA models:"
          ollama list

      - name: Fetch CodeRabbit Issues
        id: issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.pr_number }}"
          
          echo "🔍 Fetching issues from PR #$PR_NUMBER..."
          
          # Get PR comments (including CodeRabbit reviews)
          gh pr view $PR_NUMBER --json comments,reviews --jq '.' > pr_data.json
          
          # Parse issues (simplified - in production, parse CodeRabbit format)
          python3 << 'PYEOF'
          import json
          import os
          import re

          with open('pr_data.json', 'r') as f:
              data = json.load(f)

          issues = []
          
          # Parse comments for potential issues
          for comment in data.get('comments', []):
              body = comment.get('body', '')
              author = comment.get('author', {}).get('login', '')
              
              # Look for CodeRabbit-style suggestions
              if 'coderabbit' in author.lower() or 'suggestion' in body.lower():
                  # Extract file and line info if present
                  file_match = re.search(r'File:\s*`?([^\s`]+\.(?:py|js|ts))`?', body)
                  line_match = re.search(r'Line:\s*(\d+)', body)
                  
                  if file_match:
                      issue = {
                          'path': file_match.group(1),
                          'line': int(line_match.group(1)) if line_match else 1,
                          'body': body[:500],
                          'category': 'code_quality'
                      }
                      issues.append(issue)

          # Also check reviews
          for review in data.get('reviews', []):
              body = review.get('body', '')
              if body:
                  file_match = re.search(r'File:\s*`?([^\s`]+\.(?:py|js|ts))`?', body)
                  line_match = re.search(r'Line:\s*(\d+)', body)
                  
                  if file_match:
                      issue = {
                          'path': file_match.group(1),
                          'line': int(line_match.group(1)) if line_match else 1,
                          'body': body[:500],
                          'category': 'code_quality'
                      }
                      issues.append(issue)

          # Save issues
          with open('issues.json', 'w') as f:
              json.dump(issues, f, indent=2)

          print(f"Found {len(issues)} issues to process")
          
          # Set output
          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
              f.write(f'count={len(issues)}\n')
          PYEOF

      - name: Run Hybrid Swarm Fixer
        id: swarm_fix
        env:
          # GitHub
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Primary: OLLAMA (local, no key needed)
          # Fallback 1: Kimi K2.5 API
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          # Fallback 2: GLM-5 API
          GLM5_API_KEY: ${{ secrets.GLM5_API_KEY }}
          # Fallback 3: DashScope API
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.pr_number }}"
          MIN_SCORE="${{ github.event.inputs.min_score || '0.7' }}"
          
          echo ""
          echo "══════════════════════════════════════════════════════════"
          echo "🤖 HYBRID SWARM AUTO-FIXER"
          echo "══════════════════════════════════════════════════════════"
          echo ""
          echo "PR Number: $PR_NUMBER"
          echo "Repository: ${{ github.repository }}"
          echo "Min Score: $MIN_SCORE"
          echo ""
          echo "AI Provider Priority:"
          echo "  1️⃣  OLLAMA (local, FREE)"
          echo "  2️⃣  Kimi K2.5 API"
          echo "  3️⃣  GLM-5 API"
          echo "  4️⃣  DashScope API"
          echo ""
          echo "══════════════════════════════════════════════════════════"
          echo ""

          # Run the fixer
          python agents/hybrid_swarm_fixer.py \
            --pr "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --issues issues.json \
            --min-score "$MIN_SCORE" 2>&1 | tee swarm_output.txt

          # Extract results robustly - try multiple patterns
          FIXES_APPLIED=$(grep -E 'fixes_applied' swarm_output.txt 2>/dev/null | grep -oE '[0-9]+' | head -1 || echo '0')
          echo "fixes_applied=${FIXES_APPLIED}" >> $GITHUB_OUTPUT
          echo "Extracted fixes_applied: ${FIXES_APPLIED}"

      - name: Validate applied fixes
        if: success()
        run: |
          echo "🔍 Validating all changes..."
          
          # Python syntax check - safe iteration over filenames
          echo "Checking Python syntax..."
          SYNTAX_ERRORS=""
          while IFS= read -r -d '' pyfile; do
            if ! python -m py_compile "$pyfile" 2>&1; then
              SYNTAX_ERRORS="${SYNTAX_ERRORS}\nFAIL: ${pyfile}"
            fi
          done < <(find . -name "*.py" -type f -print0 2>/dev/null)
          
          if [ -z "$SYNTAX_ERRORS" ]; then
            echo "✅ All Python files pass syntax check"
          else
            echo "⚠️ Some syntax issues detected:"
            echo -e "$SYNTAX_ERRORS"
          fi
          
          # Run tests if available
          if [ -d "tests" ] || [ -f "pytest.ini" ]; then
            echo "Running tests..."
            pytest --tb=short -q 2>&1 | tail -10 || echo "⚠️ Some tests may have issues"
          fi

      - name: Push approved fixes
        if: success() && steps.swarm_fix.outputs.fixes_applied != '0'
        run: |
          git config user.name "Hybrid Swarm Bot"
          git config user.email "swarm@vaal-ai-empire.local"

          # Add and commit all changes
          git add -A
          
          if git diff --staged --quiet; then
            echo "No changes to push"
          else
            git commit -m "🤖 Hybrid Swarm Auto-Fix [skip ci]"
            git push origin HEAD:${{ steps.pr.outputs.pr_branch }}
            echo "✅ Pushed fixes to PR branch"
          fi

      - name: Export Prometheus Metrics
        if: always()
        run: |
          echo "📊 Prometheus metrics from this run:"
          echo ""
          
          # Try to read metrics
          if [ -f "swarm_metrics.db" ]; then
            echo "SQLite metrics stored in swarm_metrics.db"
            sqlite3 swarm_metrics.db "SELECT provider, COUNT(*) FROM fixes GROUP BY provider;" 2>/dev/null || true
          fi
          
          echo ""
          echo "Metrics are also available via prometheus_client on port 8000 during execution"

      - name: Comment results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '## 🤖 Hybrid Swarm Auto-Fixer Results\n\n';

            const fixStatus = '${{ steps.swarm_fix.outcome }}';

            if (fixStatus === 'success') {
              const fixesApplied = '${{ steps.swarm_fix.outputs.fixes_applied }}' || '0';

              comment += '✅ **Swarm fixing completed**\n\n';
              comment += '| Metric | Value |\n';
              comment += '|--------|-------|\n';
              comment += `| Fixes Applied | ${fixesApplied} |\n`;
              comment += '| Primary Provider | OLLAMA (local) |\n';
              comment += '| Fallbacks | Kimi K2.5, GLM-5, DashScope |\n';
              comment += '\n';

              comment += '### 🔧 AI Provider Priority\n';
              comment += '1. 🏠 **OLLAMA** (local, FREE) - Primary\n';
              comment += '2. ☁️ **Kimi K2.5 API** - Fallback\n';
              comment += '3. ☁️ **GLM-5 API** - Fallback\n';
              comment += '4. ☁️ **DashScope API** - Fallback\n';
              comment += '\n';

              comment += '### 📊 Monitoring\n';
              comment += '- Prometheus metrics exported\n';
              comment += '- SQLite metrics stored in artifacts\n';
              comment += '\n';

              comment += '*Built for YOUR infrastructure using YOUR API keys*\n';
            } else {
              comment += '❌ **Swarm fixing encountered issues**\n\n';
              comment += 'Check workflow logs for details.\n';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.pr_number }},
              body: comment
            });

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-metrics-${{ steps.pr.outputs.pr_number }}
          path: |
            swarm_metrics.db
            swarm_output.txt
            issues.json
            pr_data.json
            *.log
          retention-days: 30
          if-no-files-found: ignore

  # Summary job
  swarm-summary:
    name: Swarm Fix Summary
    runs-on: ubuntu-latest
    needs: [check-trigger, hybrid-swarm-fix]
    if: always() && needs.check-trigger.outputs.should_run == 'true'

    steps:
      - name: Summary
        run: |
          echo "## 🤖 Hybrid Swarm Auto-Fixer Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "PR Number: ${{ needs.check-trigger.outputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.hybrid-swarm-fix.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### AI Providers Used" >> $GITHUB_STEP_SUMMARY
          echo "- 🏠 OLLAMA (local, primary)" >> $GITHUB_STEP_SUMMARY
          echo "- ☁️ Kimi K2.5 API (fallback)" >> $GITHUB_STEP_SUMMARY
          echo "- ☁️ GLM-5 API (fallback)" >> $GITHUB_STEP_SUMMARY
          echo "- ☁️ DashScope API (fallback)" >> $GITHUB_STEP_SUMMARY
