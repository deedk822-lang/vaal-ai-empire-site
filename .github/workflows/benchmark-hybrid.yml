name: Hybrid Benchmark

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - ollama
          - direct
      category:
        description: 'Test category (leave empty for all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - security
          - efficiency
          - code_generation
          - debugging
          - financial
      models:
        description: 'Models to test (comma-separated)'
        required: false
        default: 'kimi-k2.5,glm-5'

concurrency:
  group: hybrid-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  ollama-benchmark:
    name: Ollama Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event.inputs.backend != 'direct' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio requests

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama daemon
        run: |
          ollama serve &
          sleep 5

      - name: Pull available models
        run: |
          ollama pull llama3.2:latest || echo "llama3.2 not available"
          ollama list
        continue-on-error: true

      - name: Create results directory
        run: mkdir -p benchmark_results

      - name: Run Ollama benchmarks
        run: |
          python agents/benchmark_executor.py --run-all --report --backend ollama --output benchmark_results/ollama_report.json || true
        continue-on-error: true

      - name: Upload Ollama results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-benchmark-results
          path: benchmark_results/
          retention-days: 30

  direct-api-benchmark:
    name: Direct API Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ollama-benchmark
    if: always() && (github.event.inputs.backend == 'direct' || github.event.inputs.backend == 'auto' || github.event.inputs.backend == '')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio requests

      - name: Create results directory
        run: mkdir -p benchmark_results

      - name: Run Direct API benchmarks
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GLM5_API_KEY: ${{ secrets.GLM5_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          python agents/benchmark_executor.py --run-all --report --backend direct --output benchmark_results/direct_report.json || true
        continue-on-error: true

      - name: Upload Direct API results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-api-benchmark-results
          path: benchmark_results/
          retention-days: 30

  summary:
    name: Generate Benchmark Summary
    runs-on: ubuntu-latest
    needs: [ollama-benchmark, direct-api-benchmark]
    if: always()

    steps:
      - name: Download Ollama results
        uses: actions/download-artifact@v4
        with:
          name: ollama-benchmark-results
          path: results/ollama
        continue-on-error: true

      - name: Download Direct API results
        uses: actions/download-artifact@v4
        with:
          name: direct-api-benchmark-results
          path: results/direct
        continue-on-error: true

      - name: Generate combined summary
        run: |
          echo "## Hybrid Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Benchmarks completed successfully." >> $GITHUB_STEP_SUMMARY
