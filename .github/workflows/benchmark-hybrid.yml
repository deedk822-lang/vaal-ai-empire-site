name: Hybrid Benchmark

on:
  push:
    branches: [main, master, digital-preeminence-fixes, optimal-performance]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend mode'
        required: false
        default: 'auto'
        type: choice
        options: [auto, ollama, direct]
      category:
        description: 'Test category (empty = all)'
        required: false
        default: ''
        type: choice
        options: ['', security, efficiency, code_generation, debugging, financial]
      models:
        description: 'Models to test (comma-separated)'
        required: false
        default: 'kimi-k2.5,glm-5'

permissions:
  contents: read

concurrency:
  group: hybrid-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  ollama-benchmark:
    name: Ollama Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.inputs.backend != 'direct'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio requests

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh || true
          ollama serve &
          sleep 5
        continue-on-error: true

      - name: Pull available models
        run: |
          ollama pull llama3.2:latest || echo "::warning::llama3.2 unavailable"
          ollama list || true
        continue-on-error: true

      - name: Create results directory
        run: mkdir -p benchmark_results

      - name: Run Ollama benchmarks
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GLM5_API_KEY: ${{ secrets.GLM5_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_HOST: "127.0.0.1:11434"
        run: |
          if [ -f "agents/benchmark_executor.py" ]; then
            python agents/benchmark_executor.py \
              --run-all --report \
              --backend ollama \
              --output benchmark_results/ollama_report.json || true
          else
            echo "::notice::benchmark_executor.py not found"
          fi
        continue-on-error: true

      - name: Upload Ollama results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ollama-benchmark-results
          path: benchmark_results/
          retention-days: 30

  direct-api-benchmark:
    name: Direct API Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ollama-benchmark
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio requests

      - name: Create results directory
        run: mkdir -p benchmark_results

      - name: Run Direct API benchmarks
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GLM5_API_KEY: ${{ secrets.GLM5_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          if [ -f "agents/benchmark_executor.py" ]; then
            python agents/benchmark_executor.py \
              --run-all --report \
              --backend direct \
              --output benchmark_results/direct_report.json || true
          else
            echo "::notice::benchmark_executor.py not found"
          fi
        continue-on-error: true

      - name: Upload Direct API results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: direct-api-benchmark-results
          path: benchmark_results/
          retention-days: 30

  summary:
    name: Generate Benchmark Summary
    runs-on: ubuntu-latest
    needs: [ollama-benchmark, direct-api-benchmark]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download Ollama results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ollama-benchmark-results
          path: results/ollama
        continue-on-error: true

      - name: Download Direct API results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: direct-api-benchmark-results
          path: results/direct
        continue-on-error: true

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded files ==="
          ls -la results/ || echo "results/ directory not found"
          ls -la results/ollama/ 2>/dev/null || echo "ollama results not found"
          ls -la results/direct/ 2>/dev/null || echo "direct results not found"

      - name: Generate combined summary
        run: |
          python3 << 'PYEOF' || true
          import json, os, sys
          from pathlib import Path
          
          lines = ["## Hybrid Benchmark Results\n"]
          
          def render_backend(label, path_obj):
              lines.append(f"### {label}\n")
              if not path_obj.exists():
                  lines.append(f"⚠️ {label} benchmark not run or results unavailable\n")
                  lines.append(f"Expected path: {path_obj.absolute()}\n")
                  return
              try:
                  data = json.loads(path_obj.read_text())
              except Exception as e:
                  lines.append(f"⚠️ Could not parse results: {e}\n")
                  return
              summary = data.get("summary", {})
              
              lines.append("| Metric | Value |")
              lines.append("|--------|-------|")
              lines.append(f"| Total Tests    | {summary.get('total_tests', 0)} |")
              lines.append(f"| Passed         | {summary.get('passed_tests', 0)} |")
              lines.append(f"| Overall Score  | {summary.get('overall_score', 0):.1f}% |")
              lines.append("")
          
          # Create results directories if they don't exist
          Path("results/ollama").mkdir(parents=True, exist_ok=True)
          Path("results/direct").mkdir(parents=True, exist_ok=True)
          
          # Also check for files in root of download directories
          ollama_path = Path("results/ollama/ollama_report.json")
          if not ollama_path.exists():
              # Try alternative paths
              alt_paths = list(Path("results/ollama").glob("*.json"))
              if alt_paths:
                  ollama_path = alt_paths[0]
                  lines.append(f"⚠️ Using alternative Ollama result file: {ollama_path.name}\n")
          
          direct_path = Path("results/direct/direct_report.json")
          if not direct_path.exists():
              alt_paths = list(Path("results/direct").glob("*.json"))
              if alt_paths:
                  direct_path = alt_paths[0]
                  lines.append(f"⚠️ Using alternative Direct API result file: {direct_path.name}\n")
          
          render_backend("Ollama Backend", ollama_path)
          render_backend("Direct API Backend", direct_path)
          
          output = "\n".join(lines)
          print(output)
          
          sf = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          try:
              with open(sf, "a") as f:
                  f.write(output + "\n")
          except Exception as e:
              print(f"Warning: Could not write to summary: {e}", file=sys.stderr)
          
          print("\n✅ Benchmark summary generated successfully")
          PYEOF
