name: Hybrid Benchmark

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - ollama
          - direct
      category:
        description: 'Test category (leave empty for all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - security
          - efficiency
          - code_generation
          - debugging
          - financial
      models:
        description: 'Models to test (comma-separated)'
        required: false
        default: 'kimi-k2.5,glm-5'

concurrency:
  group: hybrid-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Job 1: Ollama Backend (Development/Local Testing)
  ollama-benchmark:
    name: Ollama Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event.inputs.backend != 'direct' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio requests

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama daemon
        run: |
          ollama serve &
          sleep 5

      - name: Authenticate Ollama Cloud (optional)
        if: ${{ secrets.OLLAMA_TOKEN != '' }}
        env:
          OLLAMA_TOKEN: ${{ secrets.OLLAMA_TOKEN }}
        run: |
          echo "$OLLAMA_TOKEN" | ollama signin || echo "Ollama Cloud auth skipped"

      - name: Pull available models
        run: |
          # Try to pull models (resilient - continue on failure)
          ollama pull kimi-k2.5:cloud || echo "⚠️ kimi-k2.5:cloud not available (may need Ollama Cloud)"
          ollama pull glm5 || echo "⚠️ glm5 not available"
          ollama pull llama3.2:latest || echo "⚠️ llama3.2 not available"
          ollama list

      - name: Create results directory
        run: mkdir -p benchmark_results

      - name: Run Ollama benchmarks
        run: |
          CATEGORY_ARG=""
          if [ -n "${{ github.event.inputs.category }}" ]; then
            CATEGORY_ARG="--category ${{ github.event.inputs.category }}"
          fi
          
          python agents/benchmark_executor.py \
            --run-all \
            --report \
            --backend ollama \
            --output benchmark_results/ollama_report.json \
            $CATEGORY_ARG
        continue-on-error: true  # Resilient: continue even if Ollama fails

      - name: Upload Ollama results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-benchmark-results
          path: benchmark_results/
          retention-days: 30

  # Job 2: Direct API Backend (Production CI)
  direct-api-benchmark:
    name: Direct API Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ollama-benchmark
    if: always() && (github.event.inputs.backend == 'direct' || github.event.inputs.backend == 'auto' || github.event.inputs.backend == '')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio requests

      - name: Create results directory
        run: mkdir -p benchmark_results

      - name: Run Direct API benchmarks
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GLM5_API_KEY: ${{ secrets.GLM5_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          CATEGORY_ARG=""
          if [ -n "${{ github.event.inputs.category }}" ]; then
            CATEGORY_ARG="--category ${{ github.event.inputs.category }}"
          fi
          
          python agents/benchmark_executor.py \
            --run-all \
            --report \
            --backend direct \
            --output benchmark_results/direct_report.json \
            $CATEGORY_ARG
        continue-on-error: true  # Resilient: handles missing secrets gracefully

      - name: Upload Direct API results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-api-benchmark-results
          path: benchmark_results/
          retention-days: 30

  # Job 3: Generate Combined Summary
  summary:
    name: Generate Benchmark Summary
    runs-on: ubuntu-latest
    needs: [ollama-benchmark, direct-api-benchmark]
    if: always()

    steps:
      - name: Download Ollama results
        uses: actions/download-artifact@v4
        with:
          name: ollama-benchmark-results
          path: results/ollama
        continue-on-error: true

      - name: Download Direct API results
        uses: actions/download-artifact@v4
        with:
          name: direct-api-benchmark-results
          path: results/direct
        continue-on-error: true

      - name: Generate combined summary
        run: |
          python -c "
          import json
          import os
          from pathlib import Path

          summary_lines = ['## Hybrid Benchmark Results\n']

          # Check Ollama results
          ollama_path = Path('results/ollama/ollama_report.json')
          if ollama_path.exists():
              with open(ollama_path) as f:
                  data = json.load(f)
              summary = data.get('summary', {})
              backend_stats = data.get('backend_stats', {})
              
              summary_lines.append('### Ollama Backend\n')
              summary_lines.append('| Metric | Value |')
              summary_lines.append('|--------|-------|')
              summary_lines.append(f'| Total Tests | {summary.get(\"total_tests\", 0)} |')
              summary_lines.append(f'| Passed | {summary.get(\"passed_tests\", 0)} |')
              summary_lines.append(f'| Overall Score | {summary.get(\"overall_score\", 0):.1f}% |')
              summary_lines.append(f'| Resilient Fallbacks | {backend_stats.get(\"resilient_fallbacks\", 0)} |')
              summary_lines.append('')
          else:
              summary_lines.append('### Ollama Backend\n')
              summary_lines.append('⚠️ Ollama benchmark not run or failed\n')

          # Check Direct API results
          direct_path = Path('results/direct/direct_report.json')
          if direct_path.exists():
              with open(direct_path) as f:
                  data = json.load(f)
              summary = data.get('summary', {})
              provider_stats = data.get('provider_stats', {})
              
              summary_lines.append('### Direct API Backend\n')
              summary_lines.append('| Metric | Value |')
              summary_lines.append('|--------|-------|')
              summary_lines.append(f'| Total Tests | {summary.get(\"total_tests\", 0)} |')
              summary_lines.append(f'| Passed | {summary.get(\"passed_tests\", 0)} |')
              summary_lines.append(f'| Overall Score | {summary.get(\"overall_score\", 0):.1f}% |')
              summary_lines.append(f'| Tokens Used | {summary.get(\"total_tokens_used\", 0)} |')
              summary_lines.append('')
              
              if provider_stats.get('usage'):
                  summary_lines.append('**Providers Used:**')
                  for provider, count in provider_stats['usage'].items():
                      summary_lines.append(f'- {provider}: {count} requests')
          else:
              summary_lines.append('### Direct API Backend\n')
              summary_lines.append('⚠️ Direct API benchmark not run or no API keys configured\n')

          # Write summary
          print('\\n'.join(summary_lines))
          
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/stdout')
          with open(summary_file, 'w') as f:
              f.write('\\n'.join(summary_lines))
          "
