name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ============================================
  # Node.js Backend Tests & Linting
  # ============================================
  server-ci:
    name: Server CI (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || echo "No lint script configured"

      - name: Run security audit
        run: npm audit --audit-level=moderate || true

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          STRIPE_SECRET_KEY: sk_test_dummy
          MONGODB_URI: mongodb://localhost:27017/test

      - name: Upload coverage report
        if: matrix.node-version == '18.x'
        uses: codecov/codecov-action@v3
        with:
          directory: ./server/coverage
          flags: server
          name: server-coverage

  # ============================================
  # Frontend / Static Site Checks
  # ============================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate HTML
        run: |
          npm install -g htmlhint
          htmlhint *.html || true

      - name: Validate CSS
        run: |
          npm install -g stylelint stylelint-config-standard
          stylelint "css/**/*.css" || true

      - name: Check links
        run: |
          npm install -g broken-link-checker
          blc -ro --exclude https://stripe.com --exclude https://dashboard.stripe.com file://$(pwd)/index.html || true

  # ============================================
  # Python Agents Tests & Linting
  # ============================================
  python-ci:
    name: Python CI
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort pytest pytest-cov

      - name: Lint with flake8
        run: |
          flake8 agents/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 agents/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check formatting with black
        run: black --check agents/ || true

      - name: Check imports with isort
        run: isort --check-only agents/ || true

      - name: Run pytest
        run: pytest agents/ -v --cov=agents --cov-report=xml --cov-report=term || echo "No tests yet"

      - name: Upload Python coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: python
          name: python-coverage

  # ============================================
  # Environment Validation
  # ============================================
  env-validation:
    name: Environment Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate .env.example completeness
        run: |
          echo "Checking .env.example exists and has content..."
          test -f .env.example && test -s .env.example
          echo "✅ .env.example is valid"

      - name: Check for secrets in code
        run: |
          if grep -r "sk_live_" --include="*.js" --include="*.py" . 2>/dev/null; then
            echo "❌ Found potential live Stripe key!"
            exit 1
          fi
          if grep -r "sk-[a-zA-Z0-9]{48}" --include="*.js" --include="*.py" . 2>/dev/null; then
            echo "❌ Found potential secret key!"
            exit 1
          fi
          echo "✅ No obvious secrets found"

      - name: Validate JSON files
        run: |
          for file in $(find . -name "*.json" -not -path "*/node_modules/*" -not -path "*/.git/*"); do
            python3 -c "import json; json.load(open('$file'))" 2>/dev/null || echo "⚠️ Invalid JSON: $file"
          done
          echo "✅ JSON validation complete"

  # ============================================
  # Build Verification
  # ============================================
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [server-ci, python-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Test server startup
        working-directory: ./server
        run: |
          npm ci
          timeout 10s npm start || echo "Server start test completed"
        env:
          NODE_ENV: test
          PORT: 9999
          STRIPE_SECRET_KEY: sk_test_dummy
          MONGODB_URI: mongodb://localhost:27017/test
