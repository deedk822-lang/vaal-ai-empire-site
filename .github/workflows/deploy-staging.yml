name: Staging Deploy

on:
  push:
    branches: [ main, merge/develop-to-main ]

env:
  DOMAIN: ${{ secrets.DOMAIN }}
  STAGING_URL: ${{ secrets.STAGING_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip if Alibaba Cloud secrets are not configured
    if: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID != '' }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}/site:staging
        build-args: |
          DOMAIN=${{ secrets.DOMAIN }}

    - name: Deploy to Alibaba Cloud
      uses: aliyun/ack-set-context@v1
      with:
        access-key-id: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
        access-key-secret: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        cluster-id: ${{ secrets.ALIBABA_CLOUD_CLUSTER_ID }}

    - name: Update Deployment
      run: |
        kubectl set image deployment/vaal-ai-site site=ghcr.io/${{ github.repository }}/site:staging
        kubectl rollout status deployment/vaal-ai-site
        echo "Deployed to ${{ secrets.STAGING_URL }}"
