name: Staging Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      id: build_push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/site:staging
        cache-from: type=gha
        cache-to: type=gha,mode=max
      continue-on-error: true

    - name: Check build status
      if: steps.build_push.outcome == 'failure'
      run: |
        echo "::warning::Docker build/push failed. This may be due to missing Dockerfile context or registry permissions."
        echo "Build outcome: ${{ steps.build_push.outcome }}"
        exit 0

    - name: Deploy to Alibaba Cloud
      if: steps.build_push.outcome == 'success'
      uses: aliyun/ack-set-context@v1
      with:
        access-key-id: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
        access-key-secret: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        cluster-id: ${{ secrets.ALIBABA_CLOUD_CLUSTER_ID }}
      continue-on-error: true

    - name: Update Deployment
      if: steps.build_push.outcome == 'success'
      run: |
        kubectl set image deployment/vaal-ai-site site=ghcr.io/${{ github.repository }}/site:staging
        kubectl rollout status deployment/vaal-ai-site
      continue-on-error: true

    - name: Deployment Summary
      if: always()
      run: |
        echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
        echo "- Build: ${{ steps.build_push.outcome }}" >> $GITHUB_STEP_SUMMARY
        echo "- Image: ghcr.io/${{ github.repository }}/site:staging" >> $GITHUB_STEP_SUMMARY
