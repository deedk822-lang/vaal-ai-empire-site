name: Deploy to Staging

on:
  push:
    branches:
      - main
      - develop
      - staging
      - "release/**"
      - "hotfix/**"

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Build, Push & Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents:  read
      packages:  write

    steps:
      # ── 1. Checkout ──────────────────────────
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # ── 2. Docker meta ───────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbea8a986b162c43c2d8ea3c4457 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=staging-
            type=ref,event=branch

      # ── 3. Docker login ──────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Build & push ──────────────────────
      # REMOVED: continue-on-error: true
      # Rationale: a Docker build/push failure must fail the job so the smoke
      # test never runs against a stale or missing image.
      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # pinned
        with:
          context: .
          push:    true
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── 5. Smoke test ────────────────────────
      - name: Smoke test staging
        env:
          STAGING_URL: ${{ vars.STAGING_URL || 'https://staging.vaalai.co.za' }}
        run: |
          MAX_ATTEMPTS=12
          WAIT_SECONDS=10
          attempt=1

          echo "Smoke-testing $STAGING_URL ..."

          while [ $attempt -le $MAX_ATTEMPTS ]; do
            echo "Attempt $attempt / $MAX_ATTEMPTS"
            HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              --max-time 10 \
              --retry 0 \
              "$STAGING_URL/health" || echo "000")

            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ Staging is healthy (HTTP $HTTP_STATUS)."
              echo "result=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "  Health check returned HTTP $HTTP_STATUS — waiting ${WAIT_SECONDS}s ..."
            sleep "$WAIT_SECONDS"
            attempt=$((attempt + 1))
          done

          # ── Exhausted all attempts ────────────
          # Removed: `exit 0` which silently passed broken deployments.
          # Now exits non-zero so the job (and therefore the deployment) fails.
          echo "::error::Staging health check failed after $MAX_ATTEMPTS attempts."
          echo "result=failed" >> "$GITHUB_OUTPUT"
          exit 1

      # ── 6. Notify on failure ─────────────────
      - name: Notify deployment failure
        if: failure()
        run: |
          echo "::warning::Staging deployment failed for ${{ github.ref }}. " \
               "Image: ${{ steps.meta.outputs.tags }}"
