name: Sentient Financial Sentinel CI/CD

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: python -m pip install --upgrade pip bandit
      - name: Run Bandit
        run: bandit -r . -q

  workflow_summary:
    name: Workflow Summary
    needs:
      - security_scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Emit workflow summary
        run: echo "Sentient Financial Sentinel CI/CD completed successfully."
