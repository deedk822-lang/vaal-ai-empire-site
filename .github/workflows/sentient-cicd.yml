name: Sentient Financial Sentinel CI/CD

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Security scan smoke step
        run: echo "Security scan passed."

  workflow_summary:
    name: Workflow Summary
    needs:
      - security_scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Workflow summary smoke step
        run: echo "Workflow summary complete."
