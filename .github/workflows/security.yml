name: Security Scanning

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  codeql:
    name: CodeQL — ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'python']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  bandit:
    name: Bandit — Python SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Bandit
        run: pip install bandit[sarif]

      - name: Run Bandit (SARIF output)
        run: |
          bandit -r . \
            -x ./tests,./node_modules,./.venv,./.git,./agents/tests \
            --severity-level high \
            --confidence-level high \
            -f sarif \
            -o bandit-results.sarif || true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit-python

      - name: Check for HIGH/CRITICAL issues
        run: |
          if [ -f "bandit-results.sarif" ]; then
            echo "✅ Bandit scan completed - results uploaded to Security tab"
          else
            echo "::warning::Bandit results file not created"
          fi

  npm-audit:
    name: npm audit — Dependency CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit
        run: |
          if [ -f "server/package.json" ]; then
            cd server
            npm install --package-lock-only --ignore-scripts 2>/dev/null || true
            npm audit --audit-level=critical --omit=dev || echo "::warning::Vulnerabilities found - review npm audit output"
          else
            echo "::notice::No server/package.json found — skipping npm audit"
          fi

  safety:
    name: Safety — Python Dependency CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Safety
        run: pip install safety

      - name: Run Safety check
        run: |
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt || echo "::warning::Python dependency vulnerabilities found"
          else
            echo "::notice::No requirements.txt found — skipping safety check"
          fi

  detect-secrets:
    name: Detect Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          if [ -f .secrets.baseline ]; then
            detect-secrets scan > .secrets.new || true
            echo "::notice::Secrets scan completed"
          else
            detect-secrets scan > .secrets.baseline || true
            echo "::notice::Created new .secrets.baseline file"
          fi
