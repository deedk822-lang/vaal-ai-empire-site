name: Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  # ============================================
  # Node.js Security Audit
  # ============================================
  npm-security:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Run npm audit (Root)
        run: npm audit --audit-level=moderate || true

      - name: Run npm audit (Server)
        working-directory: ./server
        run: npm audit --audit-level=moderate || true

  # ============================================
  # Python Security Scan
  # ============================================
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety || pip install bandit

      - name: Run Bandit (Python SAST)
        run: |
          bandit -r agents/ -f json -o bandit-report.json || bandit -r agents/ || echo "Bandit completed"
        continue-on-error: true

      - name: Run Safety (Dependency Check)
        run: |
          safety check -r requirements.txt || echo "Safety check completed with issues"
        continue-on-error: true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30
          if-no-files-found: ignore

  # ============================================
  # CodeQL Analysis (GitHub)
  # ============================================
  # Note: This job is skipped for PRs from forks because GitHub
  # doesn't allow fork PRs to write security events.
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    # Skip CodeQL on fork PRs as they can't write security events
    # This prevents "Resource not accessible by integration" errors
    if: |
      github.event_name != 'pull_request' || 
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'python']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
        continue-on-error: true

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
        continue-on-error: true

  # ============================================
  # Secret Scanning
  # ============================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Manual secret patterns check
        shell: bash
        run: |
          echo "Checking for common secret patterns..."
          
          # Create regex patterns file
          cat > /tmp/secret_patterns.txt << 'PATTERNS'
          sk_live_[a-zA-Z0-9]{24,}
          sk_test_[a-zA-Z0-9]{24,}
          pk_live_[a-zA-Z0-9]{24,}
          AKIA[0-9A-Z]{16}
          ghp_[a-zA-Z0-9]{36}
          glpat-[a-zA-Z0-9\-]{20}
          PATTERNS
          
          found=0
          while IFS= read -r pattern; do
            # Skip empty lines
            [ -z "$pattern" ] && continue
            
            matches=$(grep -rE "$pattern" \
              --include="*.js" \
              --include="*.py" \
              --include="*.json" \
              --include="*.yml" \
              --include="*.yaml" \
              . 2>/dev/null | grep -v "node_modules" | grep -v ".git" | grep -v "package-lock" || true)
            
            if [ -n "$matches" ]; then
              echo "⚠️  Potential matches for pattern: $pattern"
              echo "$matches"
              found=1
            fi
          done < /tmp/secret_patterns.txt
          
          if [ $found -eq 1 ]; then
            echo "⚠️  Potential secrets found. Please review and remove if real."
          else
            echo "✅ No obvious secrets found in code"
          fi

  # ============================================
  # Dependency Review (PR only)
  # ============================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: true
          fail-on-severity: moderate
