name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, merge/develop-to-main ]
  pull_request:
    branches: [ main, master, merge/develop-to-main ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  lint-and-test-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'server/package-lock.json'
    - name: Install dependencies
      working-directory: ./server
      run: npm ci || npm install
      continue-on-error: true
    - name: Run ESLint
      working-directory: ./server
      run: npm run lint --if-present
      continue-on-error: true
    - name: Run tests
      working-directory: ./server
      run: npm test --if-present
      continue-on-error: true

  lint-and-test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio flake8 black isort
    - name: Run Black
      run: black --check --extend-exclude='\.venv|node_modules|__pycache__|\.git|build|dist' .
      continue-on-error: true
    - name: Run isort
      run: isort --check-only --skip .venv --skip node_modules --skip __pycache__ .
      continue-on-error: true
    - name: Run flake8
      run: flake8 . --exclude=.venv,node_modules,__pycache__,.git,build,dist --max-line-length=100
      continue-on-error: true
    - name: Run pytest
      run: pytest agents/tests/ -v --tb=short
      continue-on-error: true
