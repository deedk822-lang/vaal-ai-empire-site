name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, merge/develop-to-main ]
  pull_request:
    branches: [ main, master, merge/develop-to-main ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  lint-and-test-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
      continue-on-error: true
    - name: Run ESLint
      run: npm run lint
      continue-on-error: true
    - name: Run tests
      run: npm test
      continue-on-error: true

  lint-and-test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio flake8 black isort
    - name: Check formatting with black
      run: black --check --exclude='\.venv|venv|env|__pycache__|\.git|\.tox|\.eggs|.*\.egg|build|dist|node_modules' .
      continue-on-error: true
    - name: Check imports with isort
      run: isort --check-only --skip .venv --skip venv --skip env --skip node_modules --skip __pycache__ .
      continue-on-error: true
    - name: Lint with flake8
      run: flake8 . --exclude=.venv,venv,env,__pycache__,.git,.tox,.eggs,*.egg,build,dist,node_modules,.pytest_cache,htmlcov
      continue-on-error: true
    - name: Run tests
      run: pytest agents/tests/ -v
