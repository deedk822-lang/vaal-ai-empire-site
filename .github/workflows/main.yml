name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, merge/develop-to-main ]
  pull_request:
    branches: [ main, master, merge/develop-to-main ]

jobs:
  lint-and-test-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'server/package-lock.json'
    - name: Install dependencies
      working-directory: ./server
      run: npm ci
    - name: Run linting
      working-directory: ./server
      run: npm run lint --if-present
    - name: Run tests
      working-directory: ./server
      run: npm test --if-present

  lint-and-test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio flake8 black isort
    - name: Run black format check
      run: black --check --exclude="venv|__pycache__|\.git|node_modules" .
      continue-on-error: true
    - name: Run isort check
      run: isort --check-only --skip-gitignore --skip venv --skip __pycache__ --skip node_modules .
      continue-on-error: true
    - name: Run flake8 linting
      run: flake8 --exclude=venv,__pycache__,.git,node_modules,build,dist --max-line-length=100 .
      continue-on-error: true
    - name: Run Python tests
      run: pytest agents/tests/ -v --tb=short || true
