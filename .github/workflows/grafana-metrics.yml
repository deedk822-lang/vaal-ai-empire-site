name: Grafana Metrics Export

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-metrics:
    name: Export Metrics to Grafana / Prometheus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Check for required secrets
        run: |
          MISSING=()
          [ -z "${{ secrets.PROMETHEUS_URL }}"          ] && MISSING+=("PROMETHEUS_URL")
          [ -z "${{ secrets.PROMETHEUS_USER }}"         ] && MISSING+=("PROMETHEUS_USER")
          [ -z "${{ secrets.PROMETHEUS_API_KEY }}"      ] && MISSING+=("PROMETHEUS_API_KEY")
          [ -z "${{ secrets.GRAFANA_API_KEY }}"         ] && MISSING+=("GRAFANA_API_KEY")
          [ -z "${{ secrets.GRAFANA_DATASOURCE_NAME }}" ] && MISSING+=("GRAFANA_DATASOURCE_NAME")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            exit 1
          fi
          echo "All required secrets present."

      # ─── SECURITY NOTE ─────────────────────────────────────────────────────
      # The step "Upload .env as artifact" that existed in a previous revision
      # has been permanently removed.  That step persisted PROMETHEUS_* and
      # GRAFANA_* credentials to GitHub artifact storage for 24 hours, making
      # them accessible to anyone with repository read access.
      #
      # Credentials are injected directly as environment variables below and
      # are never written to disk or uploaded as artifacts.
      # ────────────────────────────────────────────────────────────────────────

      - name: Export metrics to Prometheus
        env:
          PROMETHEUS_URL:      ${{ secrets.PROMETHEUS_URL }}
          PROMETHEUS_USER:     ${{ secrets.PROMETHEUS_USER }}
          PROMETHEUS_API_KEY:  ${{ secrets.PROMETHEUS_API_KEY }}
        run: python scripts/export_prometheus_metrics.py

      - name: Export metrics to Grafana
        env:
          GRAFANA_API_KEY:          ${{ secrets.GRAFANA_API_KEY }}
          GRAFANA_DATASOURCE_NAME:  ${{ secrets.GRAFANA_DATASOURCE_NAME }}
          GRAFANA_GITHUB:           ${{ secrets.GRAFANA_GITHUB }}
        run: python scripts/export_grafana_metrics.py

      - name: Upload metrics summary (non-sensitive)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name:            metrics-summary-${{ github.run_id }}
          # Only upload the sanitised summary JSON — never the .env file
          path:            metrics-summary.json
          retention-days:  7
          if-no-files-found: ignore
