name: Swarm Auto-Fixer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect_pr_context:
    name: detect-pr-context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Determine PR context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"

  execute_enterprise_swarm:
    name: execute-enterprise-swarm
    needs:
      - detect_pr_context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate CodeRabbit API key
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
        run: |
          test -n "$CODERABBIT_API_KEY"
          echo "Enterprise swarm preflight checks passed."
