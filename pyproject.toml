[tool.black]
line-length = 88
target-version = ['py310']
extend-exclude = '''
/(
  .venv
  | .git
  | __pycache__
  | .pytest_cache
  | node_modules
  | server/node_modules
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
skip = [".venv", "node_modules", "server/node_modules", "__pycache__", ".git", ".pytest_cache"]

[tool.pytest.ini_options]
testpaths = ["agents/tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.flake8]
max-line-length = 88
extend-ignore = "E203"
exclude = [".venv", "venv", "env", "__pycache__", "node_modules", ".git", ".tox", ".eggs", "*.egg", "build", "dist", ".pytest_cache", "htmlcov"]
