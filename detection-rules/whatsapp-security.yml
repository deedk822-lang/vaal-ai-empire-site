---
title: WhatsApp User Opt-Out Not Honored
id: apex-whatsapp-004
status: experimental
description: Detects potential POPIA violation where user opted out but messages continue
author: Compliance Team
date: 2026/02/26
tags:
  - attack.impact
  - attack.t1530
  - whatsapp
  - popia
  - opt-out
logsource:
  category: application
  product: vaal-ai-empire
  service: whatsapp-messaging
detection:
  selection:
    event_type: whatsapp_message_sent
    user_opted_out: true
    opt_out_timestamp:
      before: "message_sent_timestamp - 24h"
  condition: selection
falsepositives:
  - Session messages (user-initiated) which are always allowed
  - Clock synchronization issues
level: critical
---
# APEX Compliance: POPIA 24-hour opt-out SLA
# This is a compliance violation requiring immediate investigation

