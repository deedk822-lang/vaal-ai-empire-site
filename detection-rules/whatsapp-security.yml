# WhatsApp Business API Security Detection Rules
# APEX Security Framework v2.0

---
title: WhatsApp Webhook Signature Validation Failure
id: apex-whatsapp-001
status: stable
description: Detects potential webhook spoofing attempts against WhatsApp integration
author: Security Team
date: 2026/02/26
modified: 2026/02/26
tags:
  - attack.initial_access
  - attack.t1190
  - whatsapp
  - webhook
  - hmac
logsource:
  category: application
  product: vaal-ai-empire
  service: whatsapp-webhook
detection:
  selection:
    event_type: whatsapp_webhook_received
    signature_valid: false
  timeframe: 5m
  condition: selection | count() by source_ip > 3
falsepositives:
  - Meta infrastructure IP changes
  - Clock skew between servers
  - Misconfigured app secret rotation
level: high
---
# APEX Compliance: Enforces Invariant #2 (Auth per-request)
# Owner: @security-team
# Expiry: 2027-Q1 (review when WhatsApp API version updated)
# Escalation: Slack #alerts-whatsapp → PagerDuty P1 if >10 failures/5min

---
title: WhatsApp Business Message Without Valid Consent
id: apex-whatsapp-002
status: stable
description: Detects attempts to send business-initiated messages without POPIA-compliant consent
author: Compliance Team
date: 2026/02/26
tags:
  - attack.impact
  - attack.t1530
  - whatsapp
  - popia
  - compliance
  - privacy
logsource:
  category: application
  product: vaal-ai-empire
  service: whatsapp-messaging
detection:
  selection:
    event_type: whatsapp_message_send_attempt
    message_category: marketing
    consent_valid: false
  condition: selection
falsepositives:
  - Race condition during consent grant
  - Test environment with mock consent
level: critical
---
# APEX Compliance: Enforces POPIA Invariant
# Alert threshold: ANY occurrence (zero tolerance for consent violations)
# Escalation: Immediate Slack #compliance-alerts + JIRA ticket auto-created
# Legal notification: Required within 4 hours per POPIA breach notification rules

