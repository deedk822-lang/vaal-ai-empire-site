# APEX Compliance: Invariant #3 (Input validation at trust boundaries)

---
title: WhatsApp High-Volume Opt-Out Rate
id: apex-whatsapp-006
status: experimental
description: Detects sudden spike in opt-outs indicating potential messaging abuse or consent issues
author: Compliance Team
date: 2026/02/26
tags:
  - attack.impact
  - whatsapp
  - popia
  - abuse
logsource:
  category: application
  product: vaal-ai-empire
  service: whatsapp-messaging
detection:
  selection:
    event_type: whatsapp_opt_out
  timeframe: 1h
  condition: selection | count() > 50
falsepositives:
  - Major service disruption causing mass unsubscribes
  - Marketing campaign with poor targeting
level: medium
---
# APEX Compliance: Early warning for potential POPIA investigation trigger
# Threshold: >50 opt-outs in 1 hour (>1% of typical user base)
