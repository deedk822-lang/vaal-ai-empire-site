# LocalAI Configuration for Vaal AI Empire
# This configuration provides fallback AI capabilities when primary APIs are unavailable

name: "Vaal AI Empire - LocalAI Fallback"
version: "1.0.0"

# Server configuration
server:
  host: "0.0.0.0"
  port: 8080
  threads: 4

# Model configurations
models:
  # Qwen Coder - Primary fallback for code generation
  - name: "qwen2.5-coder:1.5b"
    backend: "llama"
    parameters:
      model: "qwen2.5-coder:1.5b"
      context_size: 32768
      threads: 4
    downloads:
      - url: "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
        filename: "qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"

  # Phi-4 - Secondary fallback for general tasks
  - name: "phi4"
    backend: "llama"
    parameters:
      model: "phi4"
      context_size: 16384
      threads: 4
    downloads:
      - url: "https://huggingface.co/microsoft/Phi-4-mini-instruct/resolve/main/Phi-4-mini-instruct-Q4_K_M.gguf"
        filename: "phi4-mini-instruct-q4_k_m.gguf"

  # Embedding model for RAG
  - name: "text-embedding-v1"
    backend: "bert-embeddings"
    parameters:
      model: "all-MiniLM-L6-v2"
    downloads:
      - url: "https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/model.safetensors"
        filename: "all-MiniLM-L6-v2.safetensors"

# API configuration
api:
  # OpenAI-compatible API
  openai:
    enabled: true
    base_path: "/v1"

  # Swagger documentation
  swagger:
    enabled: true
    path: "/swagger"

# Feature toggles
features:
  # Enable GPU acceleration if available
  gpu: true

  # Enable distributed inference
  distributed: false

  # Enable autoscaling
  autoscaling: false

# Logging configuration
logging:
  level: "info"
  format: "json"

# Metrics configuration
metrics:
  enabled: true
  path: "/metrics"
