# APEX Phase 0 + Proactive Architecture Integration

models:
  qwen_3_5_plus:
    role: pattern_recognizer
    endpoint: ${QWEN_API_ENDPOINT}
    capabilities:
      - behavioral_clustering
      - anomaly_detection
      - temporal_trend_analysis
    signals:
      - code_velocity
      - error_patterns
      - search_queries
      - documentation_views
  
  glm_5:
    role: causal_reasoner
    endpoint: ${GLM_API_ENDPOINT}
    capabilities:
      - root_cause_inference
      - goal_decomposition
      - impact_forecasting
    knowledge_bases:
      - business_criticality_map
      - threat_intelligence_db
      - architectural_invariants
  
  kimi_k2_5_thinking:
    role: adversarial_simulator
    endpoint: ${KIMI_API_ENDPOINT}
    capabilities:
      - red_team_simulation
      - edge_case_generation
      - failure_mode_analysis
    scenarios:
      - malicious_actor
      - network_partition
      - resource_exhaustion
      - user_confusion

orchestrator:
  confidence_thresholds:
    auto_queue: 0.85    # Auto-queue for approval
    suggestion: 0.65    # Show as suggestion
    log_only: 0.0       # Below this: log for learning only
  
  temporal_context:
    window_days: 30
    signal_retention: 90  # Days to keep raw signals
  
  apec_integration:
    invariant_enforcement: true
    suppression_validation: true
    blast_radius_check: true

proactive_patterns:
  - name: new_payment_endpoint_security
    trigger:
      code_change: "new route with /payment in path"
      context: "no rate limiting or input validation detected"
    anticipation:
      predicted_need: ["rate_limiting", "input_validation", "signature_verification"]
      confidence: 0.89
      time_horizon: "72_hours"
    intervention:
      type: security_hardening_template
      approval_required: true
      apec_compliance:
        invariants: ["auth_per_request", "input_validation"]
        validation_tests: "tests/payment-security.test.js"
  
  - name: python_module_dependency_check
    trigger:
      code_change: "new Python file with imports"
      context: "requirements.txt not updated"
    anticipation:
      predicted_need: ["dependency_update"]
      confidence: 0.76
      time_horizon: "next_ci_run"
    intervention:
      type: ci_preemptive_fix
      approval_required: false
      user_framing: "Heads up: Your new agent imports `newlib==2.1` but it's not in requirements.txt. Add it now to avoid CI failure?"
